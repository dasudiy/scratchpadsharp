name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ScratchpadSharp.sln

      - name: Build
        run: dotnet build ScratchpadSharp.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/ScratchpadSharp.Core.Tests/ScratchpadSharp.Core.Tests.csproj -c Release --no-build
